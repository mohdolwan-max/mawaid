<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <!-- Colors sampled from the approved green Maw3ed symbol -->
  <linearGradient id="leftHead" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D7F2E8"/>
    <stop offset="0.55" stop-color="#9EDBC9"/>
    <stop offset="1" stop-color="#73C5AE"/>
  </linearGradient>
  <linearGradient id="leftBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B8E7D8"/>
    <stop offset="0.55" stop-color="#88D2BD"/>
    <stop offset="1" stop-color="#58B79F"/>
  </linearGradient>
  <linearGradient id="rightHead" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#48B8A2"/>
    <stop offset="0.5" stop-color="#228F7D"/>
    <stop offset="1" stop-color="#0F6B5E"/>
  </linearGradient>
  <linearGradient id="rightBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#50BEA8"/>
    <stop offset="0.55" stop-color="#289E8C"/>
    <stop offset="1" stop-color="#0C6D60"/>
  </linearGradient>
  <linearGradient id="clockRing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A9E0CF"/>
    <stop offset="1" stop-color="#70C6AE"/>
  </linearGradient>
  <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B6A5D"/>
    <stop offset="1" stop-color="#005548"/>
  </linearGradient>
</defs>

<!-- heads -->
<circle cx="255" cy="175" r="66" fill="url(#leftHead)"/>
<circle cx="769" cy="175" r="66" fill="url(#rightHead)"/>

<!-- vertical legs -->
<rect x="175" y="310" width="130" height="470" rx="65" fill="url(#leftBody)"/>
<rect x="719" y="310" width="130" height="470" rx="65" fill="url(#rightBody)"/>

<!-- M arms -->
<path d="M240 330 L500 555" fill="none" stroke="url(#leftBody)" stroke-width="132" stroke-linecap="round"/>
<path d="M784 330 L524 555" fill="none" stroke="url(#rightBody)" stroke-width="132" stroke-linecap="round"/>

<!-- clock -->
<circle cx="512" cy="665" r="190" fill="url(#clockRing)"/>
<circle cx="512" cy="665" r="163" fill="#FFFFFF"/>

<!-- markers -->
<g stroke="#0C6D60" stroke-width="16" stroke-linecap="round">
  <path d="M512 535 V565"/>
  <path d="M512 765 V795"/>
  <path d="M382 665 H412"/>
  <path d="M612 665 H642"/>
</g>

<!-- clock hands at 10:10 -->
<g stroke="url(#hand)" stroke-linecap="round">
  <path d="M512 665 L443 615" stroke-width="22"/>
  <path d="M512 665 L590 620" stroke-width="18"/>
</g>

<circle cx="512" cy="665" r="28" fill="#79CFB8"/>
<circle cx="512" cy="665" r="12" fill="#FFFFFF"/>
</svg>